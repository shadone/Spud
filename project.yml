# XcodeGen spec for Spud. Regenerate the project with:  xcodegen generate
# (or `make project`). The generated Spud.xcodeproj is gitignored — project.yml is the
# source of truth. LemmyKit is pinned to a released version from its git remote.
# See README.md / CLAUDE.md.
name: Spud

options:
  bundleIdPrefix: info.ddenis
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: J8B76VBZ57
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 29
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "YES"
    LIBRARY_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/SpudDataKit/Services/AppDatabase
      - $(SRCROOT)/SpudDataKit/Services/Account

packages:
  LemmyKit:
    url: https://github.com/shadone/LemmyKit
    exactVersion: 0.5.1
  DiasporaNodeInfo:
    url: https://github.com/shadone/DiasporaNodeInfo
    exactVersion: 1.4.0
  Nuke:
    url: https://github.com/kean/Nuke
    from: 13.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2
  SemVer:
    url: https://github.com/sersoft-gmbh/semver
    from: 3.0.0
  SwiftMarkdown:
    url: https://github.com/apple/swift-markdown
    branch: main
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.11.1
  SBTUITestTunnel:
    url: https://github.com/Subito-it/SBTUITestTunnel
    branch: master

targets:

  Spud:
    type: application
    platform: iOS
    sources:
      - Spud
      - Shared/Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.Spud
        CODE_SIGN_ENTITLEMENTS: Spud/Spud.entitlements
        INFOPLIST_FILE: Spud/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
        SWIFT_UPCOMING_FEATURE_REGION_BASED_ISOLATION: "YES"
        DEVELOPMENT_ASSET_PATHS: "README.md Mintfile"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: SpudDataKit
      - target: SpudMarkdownKit
      - target: SpudUIKit
      - target: SpudUtilKit
      - target: SpudWidgetExtension
      - target: OpenInAppExtension
      - target: OpenInSpudAction
      # SBTUITestTunnelServer is needed only by Debug / UI-test builds (the app's
      # `import` and `takeOff()` in AppDelegate are both #if DEBUG). XcodeGen 2.45
      # cannot scope a package product to a single configuration, so by default it
      # links in all configs. Shipping it in a Release / App Store build links a
      # private NSInvocation API (__NSMakeSpecialForwardingCaptureBlock) and is
      # rejected with ITMS-90338. `make release-project` regenerates the project
      # with the dependency between the release-strip sentinels removed; use it
      # (not `make project`) before archiving for TestFlight / the App Store.
      # >>> release-strip
      - package: SBTUITestTunnel
        product: SBTUITestTunnelServer
      # <<< release-strip

  SpudWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - SpudWidget
      - Shared/Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.Spud.Widget
        CODE_SIGN_ENTITLEMENTS: SpudWidgetExtension.entitlements
        INFOPLIST_FILE: SpudWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
    dependencies:
      - target: SpudDataKit
      - target: SpudUIKit
      - target: SpudUtilKit

  OpenInAppExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenInAppExtension
        excludes:
          # Node-only helper tests; never bundle them into the appex.
          - "Resources/__tests__/**"
          # Re-added below as folder references. A flattened group drops the
          # directory structure, so the manifest's `_locales/<locale>/` and
          # `images/<icon>` subpaths break (default_locale + icons fail to load).
          - "Resources/_locales/**"
          - "Resources/images/**"
      # Folder references preserve the subdirectory structure Safari needs.
      - path: OpenInAppExtension/Resources/_locales
        type: folder
        buildPhase: resources
      - path: OpenInAppExtension/Resources/images
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.Spud.OpenInAppExtension
        INFOPLIST_FILE: OpenInAppExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Open in Spud
        OTHER_LDFLAGS:
          - "-framework"
          - SafariServices

  OpenInSpudAction:
    type: app-extension
    platform: iOS
    sources:
      - OpenInSpudAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.Spud.OpenInSpudAction
        INFOPLIST_FILE: OpenInSpudAction/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: SpudUtilKit

  SpudDataKit:
    type: framework
    platform: iOS
    sources:
      - SpudDataKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudDataKit
    dependencies:
      - target: SpudUtilKit
      - package: LemmyKit
      - package: GRDB
      - package: KeychainAccess
      - package: SemVer
      - package: DiasporaNodeInfo
      - package: Nuke
        product: Nuke

  SpudUIKit:
    type: framework
    platform: iOS
    sources:
      - SpudUIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudUIKit
        DEFINES_MODULE: "YES"
    preBuildScripts:
      - name: SwiftGen
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which mint >/dev/null; then
              mint run swiftgen -c $SRCROOT/SpudUIKit/swiftgen.yml
          else
              echo "warning: Mint not installed, see README.md"
          fi
        outputFiles:
          - $(SRCROOT)/SpudUIKit/Resources/Assets+Generated.swift

  SpudUtilKit:
    type: framework
    platform: iOS
    sources:
      - SpudUtilKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudUtilKit

  SpudMarkdownKit:
    type: framework
    platform: iOS
    sources:
      - SpudMarkdownKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudMarkdownKit
        DEFINES_MODULE: "YES"
    dependencies:
      - target: SpudUIKit
      - target: SpudUtilKit
      - package: SwiftMarkdown
        product: Markdown

  SpudMarkdownKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpudMarkdownKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudMarkdownKitTests
    dependencies:
      - target: SpudMarkdownKit

  SpudMarkdownKitSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpudMarkdownKitSnapshotTests
        excludes:
          - "__Snapshots__/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudMarkdownKitSnapshotTests
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: SpudMarkdownKit
      - package: SnapshotTesting

  MarkdownLab:
    type: application
    platform: iOS
    sources:
      - MarkdownLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.MarkdownLab
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    dependencies:
      - target: SpudMarkdownKit
      - target: SpudUIKit
      - target: SpudUtilKit

  SpudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpudTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudTests
    dependencies:
      - target: Spud
      # MarkdownBlockCacheTests calls MarkdownParser directly; SpudMarkdownKit is
      # embedded in the Spud app but the test bundle must also link it to call
      # its public API directly.
      - target: SpudMarkdownKit

  SpudDataKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpudDataKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudDataKitTests
    dependencies:
      - target: SpudDataKit
      - target: SpudUtilKit
      - package: Nuke
        product: Nuke

  SpudUtilKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpudUtilKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudUtilKitTests
    dependencies:
      - target: SpudUtilKit

  SpudUIKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpudUIKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudUIKitTests
    dependencies:
      - target: SpudUIKit

  SpudSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Snapshot reference PNGs are read from the source tree by swift-snapshot-testing
      # at runtime (via #file), not from the test bundle. Excluding them keeps the
      # bundle free of duplicate basenames that collide across suites.
      - path: SpudSnapshotTests
        excludes:
          - "__Snapshots__/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudSnapshotTests
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: Spud
      - target: SpudDataKit
      - package: SnapshotTesting

  SpudUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SpudUITests
      # AppLaunchArgument is shared between the app and the UI tests (the UI tests
      # build launch arguments using the same enum). The original project compiled
      # this single file into both targets; mirror that here.
      - path: Spud/App/AppLaunchArgument.swift
        group: Spud/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.ddenis.SpudUITests
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: Spud
      - package: SBTUITestTunnel
        product: SBTUITestTunnelClient

schemes:
  Spud:
    build:
      targets:
        Spud: all
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: Spud.xctestplan
          defaultPlan: true
        - path: SpudSnapshots.xctestplan
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SpudDataKit:
    build:
      targets:
        SpudDataKit: all
        SpudDataKitTests: [test]
    test:
      targets:
        - SpudDataKitTests

  SpudUIKit:
    build:
      targets:
        SpudUIKit: all
        SpudUIKitTests: [test]
    test:
      targets:
        - SpudUIKitTests

  SpudMarkdownKit:
    build:
      targets:
        SpudMarkdownKit: all
        SpudMarkdownKitTests: [test]
        SpudMarkdownKitSnapshotTests: [test]
    test:
      targets:
        - SpudMarkdownKitTests
        - SpudMarkdownKitSnapshotTests

  MarkdownLab:
    build:
      targets:
        MarkdownLab: all
    run:
      config: Debug

  SpudWidgetExtension:
    build:
      targets:
        SpudWidgetExtension: all
